name: Check specs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run the unit tests
        run: python -m unittest discover tests
      - name: Validate the specs
        run: python compiler/validator.py specs/*.vcl
      - name: Check the batch files are up to date
        run: python harness/assemble.py --check
