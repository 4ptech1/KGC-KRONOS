name: Check specs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run the unit tests
        run: python -m unittest discover tests
      - name: Validate the specs (spec.md rules, grammar, types)
        run: python compiler/validator.py specs/*.vcl
      - name: Check, test and build every spec
        run: python compiler/vclc.py all specs/*.vcl -o dist
      - name: dist/forge_module.bas is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist/forge_module.bas)" ]; then
            echo "::error file=dist/forge_module.bas::out of date: run 'python compiler/vclc.py all specs/*.vcl -o dist' and commit dist/forge_module.bas"
            git diff --stat -- dist/forge_module.bas
            exit 1
          fi
      - name: docs/vcl-semantics.md is up to date
        run: python compiler/gen_semantics_doc.py --check
