name: Check specs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run the VCL spec checker
        run: python compiler/vcl_check.py specs/*.vcl
