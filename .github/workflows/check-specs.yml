name: Check specs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run the unit tests
        run: python -m unittest discover tests
      - name: Validate the specs (spec.md rules, grammar, types)
        run: python compiler/validator.py specs/*.vcl
      - name: Check, test and build every spec
        run: python compiler/vclc.py all specs/*.vcl -o dist
      - name: The committed dist/ modules are up to date
        run: |
          for f in dist/forge_module.bas dist/forge_selftest.bas dist/forge_pilot.bas; do
            if [ -n "$(git status --porcelain -- "$f")" ]; then
              echo "::error file=$f::out of date: run 'python compiler/vclc.py all specs/*.vcl -o dist' and commit $f"
              git diff --stat -- "$f"
              exit 1
            fi
          done
      - name: docs/vcl-semantics.md is up to date
        run: python compiler/gen_semantics_doc.py --check
